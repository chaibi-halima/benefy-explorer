server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA : toutes les routes inconnues renvoient index.html (React Router gère ensuite)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets fingerprintés par Vite → cache long
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Le service worker MSW ne doit jamais être mis en cache
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
